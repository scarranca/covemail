# Compiles Cove for macOS and iPhone and runs the offline core tests. Runs on demand, on pull requests
# that touch Swift code, and on pushes to agent branches (claude/**), which are written without Xcode.
# macOS runner minutes are billed at a higher rate than Linux.
name: Apple builds
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["Package.swift", "Sources/**", "Tests/**", "iOS/**", ".github/workflows/apple-builds.yml"]
  pull_request:
    paths: ["Package.swift", "Sources/**", "Tests/**", "iOS/**", ".github/workflows/apple-builds.yml"]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # Each step ends with just its errors, so they are visible in the last lines of a failed log.
      - name: Build the Mac app
        shell: bash
        run: |
          set +e
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          [ $status -eq 0 ] || { echo "==== ERRORS ===="; grep -E "error:|ld: |Undefined symbols|clang: error" build.log | sed 's|.*/covemail/||' | sort -u | head -60; grep -v "warning" build.log | tail -25; }
          exit $status
      - name: Core tests (offline)
        shell: bash
        run: |
          set +e
          swift test --filter 'CoveCoreTests' 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          [ $status -eq 0 ] || { echo "==== FAILURES ===="; grep -E "error:|failed" test.log | sed 's|.*/covemail/||' | sort -u | head -60; }
          exit $status
      - name: Build CoveMobile for iOS Simulator
        shell: bash
        run: |
          set +e
          xcodebuild build -scheme CoveMobile -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO > ios.log 2>&1; status=$?
          [ $status -eq 0 ] || { echo "==== ERRORS ===="; grep -E "error:" ios.log | sed 's|.*/covemail/||' | sort -u | head -60; tail -20 ios.log; }
          exit $status
      - name: Build the iPhone app shell
        shell: bash
        run: |
          brew install xcodegen
          scripts/ios/generate-project.sh
          set +e
          xcodebuild build -project iOS/CoveMobile.xcodeproj -scheme CoveMobileApp \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > app.log 2>&1; status=$?
          [ $status -eq 0 ] || { echo "==== ERRORS ===="; grep -E "error:" app.log | sed 's|.*/covemail/||' | sort -u | head -60; tail -20 app.log; }
          exit $status
